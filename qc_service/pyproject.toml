[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-qc-service"
version = "0.2.0"
description = "Local Excel compiler, run controller, and evidence service for Lumi QC Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
lumi-qc-service = "lumi_qc.__main__:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumi_qc = ["adapters/*.json"]
