<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">Atlas</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Overview</a>
      <a href="projects.html">Projects</a>
    </nav>
  </header>
  <main>
    <p class="eyebrow">WORKSPACE CONFIGURATION</p>
    <h1>Settings</h1>
    <form aria-label="Workspace preferences">
      <label>
        Workspace name
        <input name="workspaceName" value="Atlas Workspace">
      </label>
      <label>
        Time zone
        <select name="timeZone">
          <option>Asia/Ho_Chi_Minh</option>
          <option>UTC</option>
        </select>
      </label>
      <button type="submit">Save settings</button>
    </form>
    <details>
      <summary>View integration details</summary>
      <p>Two read-only integrations are connected.</p>
      <button type="button">Disconnect integration</button>
    </details>
  </main>
  <script src="demo.js"></script>
</body>
</html>
